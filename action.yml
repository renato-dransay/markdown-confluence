name: 'Markdown to Confluence'
description: 'Publish Markdown files to Confluence with improved link resolution'
author: 'renato-dransay'

inputs:
  atlassianUserName:
    description: 'Atlassian username (email)'
    required: true
  atlassianApiToken:
    description: 'Atlassian API token'
    required: true
  configFile:
    description: 'Path to config file'
    required: false
    default: '.markdown-confluence.json'
  folderToPublish:
    description: 'Folder containing markdown files'
    required: false
    default: '.'
  validateOnly:
    description: 'Run validation only without publishing'
    required: false
    default: 'false'
  dryRun:
    description: 'Show what would be published without making changes'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm ci
      shell: bash
      working-directory: ${{ github.action_path }}

    - name: Build
      run: npm run build
      shell: bash
      working-directory: ${{ github.action_path }}

    - name: Publish to Confluence
      run: |
        node ${{ github.action_path }}/packages/cli/dist/index.js \
          --userName "${{ inputs.atlassianUserName }}" \
          --apiToken "${{ inputs.atlassianApiToken }}" \
          --contentRoot "${{ inputs.folderToPublish }}" \
          --firstHeaderPageTitle \
          ${{ inputs.validateOnly == 'true' && '--validateOnly' || '' }} \
          ${{ inputs.dryRun == 'true' && '--dryRun' || '' }}
      shell: bash
      env:
        CONFLUENCE_CONFIG_FILE: ${{ inputs.configFile }}

branding:
  icon: 'upload-cloud'
  color: 'blue'

